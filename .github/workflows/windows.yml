# Compila Cuaderno para Windows 10 y 11 (instalador sin firmar, para uso personal).
# Se lanza a mano desde la pestaña Actions → «Compilar para Windows» → Run workflow.
# Al terminar, los instaladores (.msi y .exe) están en «Artifacts» de esa ejecución.
name: Compilar para Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # SQLCipher se compila con su propio OpenSSL, que necesita Perl (ya viene en el equipo) y NASM.
      - name: Instalar NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: npm ci

      - name: Pruebas (interfaz y núcleo)
        run: |
          npm test
          cargo test -p cuaderno-core

      # Sin clave de firma no se generan los archivos del actualizador; aquí no hacen falta.
      - name: Compilar la app
        run: npx tauri build --config .github/tauri-sin-actualizador.json

      - uses: actions/upload-artifact@v4
        with:
          name: cuaderno-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
