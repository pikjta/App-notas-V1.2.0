# Compila Cuaderno para Ubuntu y otras distribuciones Linux (sin firmar, para uso personal).
# Se lanza a mano desde la pestaña Actions → «Compilar para Ubuntu» → Run workflow.
# Al terminar, los paquetes (.deb, .rpm y .AppImage) están en «Artifacts» de esa ejecución.
# Se compila en Ubuntu 22.04 para que el resultado funcione también en versiones posteriores.
name: Compilar para Ubuntu

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential perl

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: npm ci

      - name: Pruebas (interfaz y núcleo)
        run: |
          npm test
          cargo test -p cuaderno-core

      # Sin clave de firma no se generan los archivos del actualizador; aquí no hacen falta.
      - name: Compilar la app
        run: npx tauri build --config .github/tauri-sin-actualizador.json

      - uses: actions/upload-artifact@v4
        with:
          name: cuaderno-ubuntu
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
