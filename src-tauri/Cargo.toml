[package]
name = "cuaderno"
version = "1.2.0"
description = "Cuaderno: agenda y tableros locales"
edition = "2021"
license = "MIT"

[lib]
name = "cuaderno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cuaderno-core = { path = "../crates/cuaderno-core" }
cuaderno-os = { path = "../crates/cuaderno-os" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
